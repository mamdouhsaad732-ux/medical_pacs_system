<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أرشيف المركز الطبي - الدكتور سامر</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f8fafc; margin: 0; padding: 40px; color: #1e293b; }
        .container { max-width: 850px; background: white; margin: auto; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); text-align: center; border: 1px solid #e2e8f0; }
        h2 { color: #1e3a8a; margin-bottom: 10px; font-size: 22px; }
        p.subtitle { color: #64748b; margin-bottom: 35px; font-size: 14px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .card { background: #f8fafc; border: 1px solid #cbd5e1; padding: 30px 20px; border-radius: 10px; text-decoration: none; color: #1e3a8a; font-size: 16px; font-weight: bold; transition: all 0.2s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .card:hover { background: #eff6ff; border-color: #3b82f6; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(59,130,246,0.1); }
        .back-link { display: inline-block; color: #64748b; text-decoration: none; font-weight: bold; font-size: 14px; margin-top: 15px; transition: 0.2s; }
        .back-link:hover { color: #1e293b; }
    </style>
</head>
<body>
    <div class="container">
        <h2>أرشيف الفحوصات الطبية الهرمي</h2>
        <p class="subtitle">اختر نوع الفحص المطلوب لاستعراض أرشيف السجلات</p>
        
        <div class="grid">
            <a href="/doctor/archive/CT" class="card">📁 أرشيف الطبقي المحوري (CT)</a>
            <a href="/doctor/archive/MRI" class="card">📁 أرشيف الرنين المغناطيسي (MRI)</a>
            <a href="/doctor/archive/X-Ray" class="card">📁 أرشيف الأشعة السينية (X-Ray)</a>
            <a href="/doctor/archive/Echo" class="card">📁 أرشيف الأمواج فوق الصوتية (Echo)</a>
        </div>
        
        <a href="/doctor" class="back-link">⬅ العودة إلى لوحة التحكم الرئيسية</a>
    </div>
</body>
</html>
