<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة السكرتاريا - كتابة التقارير والطباعة</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; padding: 20px; direction: rtl; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .logout-btn { background: #dc3545; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; vertical-align: middle; }
        th { background: #007bff; color: white; }
        .img-preview { width: 70px; height: 70px; object-fit: cover; border-radius: 4px; border: 1px solid #ccc; cursor: zoom-in; transition: transform 0.3s; }
        .img-preview.zoomed { transform: scale(2.5); cursor: zoom-out; z-index: 99; position: relative; }
        textarea { width: 100%; height: 60px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .print-btn { background: #28a745; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 5px; }
    </style>
    <script>
        function confirmSave() {
            return confirm("هل أنت متأكد من حفظ وتثبيت هذا التقرير للسكرتاريا والطباعة؟");
        }
        function toggleZoom(img) {
            img.classList.toggle('zoomed');
        }
    </script>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>لوحة تحكم السكرتاريا (إدخال التقارير والطباعة)</h2>
        <a href="/logout" class="logout-btn">تسجيل الخروج</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>اسم المريض</th>
                <th>تاريخ الولادة</th>
                <th>الجهاز</th>
                <th>الصورة الطبية</th>
                <th>التقرير التشخيصي (بناءً على توجيه د. سامر)</th>
                <th>رمز الـ QR</th>
                <th>الإجراء</th>
            </tr>
        </thead>
        <tbody>
            {% for p in patients %}
            <tr>
                <td>{{ p.patient_name }}</td>
                <td>{{ p.birth_date }}</td>
                <td>{{ p.modality }}</td>
                <td>
                    <img src="{{ p.image_path }}" class="img-preview" onclick="toggleZoom(this)" title="اضغط للتكبير">
                </td>
                <td>
                    <form action="/secretary/update/{{ p.uuid }}" method="POST" onsubmit="return confirmSave();">
                        <textarea name="report_text">{{ p.report_text }}</textarea>
                        <br>
                        <button type="submit" style="margin-top: 5px;">حفظ التقرير</button>
                    </form>
                </td>
                <td><img src="{{ p.qr_code_path }}" width="60" height="60"></td>
                <td>
                    <a href="/patient/{{ p.uuid }}" target="_blank" class="print-btn" onclick="return confirm('هل تريد فتح صفحة الطباعة والعرض للمريض؟');">طباعة / عرض</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
