<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة الفني - {{ user.name }}</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; padding: 20px; direction: rtl; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .logout-btn { background: #dc3545; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        form { background: #e9ecef; padding: 20px; border-radius: 6px; display: flex; gap: 15px; align-items: center; margin-bottom: 25px; flex-wrap: wrap; }
        input, button { padding: 10px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; flex: 1; min-width: 180px; }
        button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; vertical-align: middle; }
        th { background: #28a745; color: white; }
        .img-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; cursor: zoom-in; transition: transform 0.3s; }
        .img-preview.zoomed { transform: scale(2.5); cursor: zoom-out; z-index: 99; position: relative; }
    </style>
    <script>
        function confirmUpload() {
            return confirm("هل أنت متأكد من صحة بيانات المريض وتاريخ ولادته ونوع الصورة قبل رفعها وتوليد الـ QR؟");
        }
        function toggleZoom(img) {
            img.classList.toggle('zoomed');
        }
    </script>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>مرحباً، {{ user.name }} (جهاز: {{ user.modality }})</h2>
        <a href="/logout" class="logout-btn">تسجيل الخروج</a>
    </div>

    <form action="/technician/add" method="POST" enctype="multipart/form-data" onsubmit="return confirmUpload();">
        <input type="text" name="patient_name" placeholder="اسم المريض الثلاثي" required>
        <input type="date" name="birth_date" placeholder="تاريخ الولادة" title="تاريخ الولادة" required>
        <input type="file" name="image_file" accept="image/*,.dcm" required>
        <button type="submit">رفع الصورة وتوليد QR</button>
    </form>

    <h3>سجلات المرضى لهذا الجهاز</h3>
    <table>
        <thead>
            <tr>
                <th>اسم المريض</th>
                <th>تاريخ الولادة</th>
                <th>الصورة</th>
                <th>رمز الـ QR</th>
                <th>التاريخ والوقت</th>
            </tr>
        </thead>
        <tbody>
            {% for p in patients %}
            <tr>
                <td>{{ p.patient_name }}</td>
                <td>{{ p.birth_date }}</td>
                <td><img src="{{ p.image_path }}" class="img-preview" onclick="toggleZoom(this)" title="اضغط للتكبير"></td>
                <td><img src="{{ p.qr_code_path }}" width="50" height="50"></td>
                <td>{{ p.created_at }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
